name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: npm run check
      - name: Build public assets
        run: npm run build
      - name: Regression and security tests
        run: npm test
      - name: Production start smoke test
        shell: bash
        run: |
          PORT=43111 node server.mjs &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:43111/ > /dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:43111/ > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:43111/.env)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:43111/server.mjs)" = "404"

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned browser test tooling
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium and required libraries
        run: npx playwright install --with-deps chromium
      - name: Build public app
        run: npm run build
      - name: Execute browser E2E with mocked public search data
        run: node --test tests/browser.e2e.mjs
