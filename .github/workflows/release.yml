name: Versioned Source Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read

jobs:
  source-checks:
    name: release-source-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax, build, API and security regression
        run: |
          npm run check
          npm run build
          npm test
  chromium-e2e:
    name: release-browser-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and test browser
        run: |
          npm run build
          node --test tests/browser.e2e.mjs

  publish-source:
    name: publish-versioned-preview
    runs-on: ubuntu-latest
    needs: [source-checks, chromium-e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate semantic version tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Publish source-only preview after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; do not replace it."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --title "Rapfa $GITHUB_REF_NAME — source preview" \
            --generate-notes --prerelease --latest=false
